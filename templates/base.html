<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Game Library{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% if session.get('auth') %}
  <header class="top">
    <a class="brand" href="{{ url_for('index') }}">Game Library</a>
    <nav>
      <a href="{{ url_for('show_list', list_type='collection') }}"
         {% if list_type == 'collection' %}class="active"{% endif %}>Collection</a>
      <a href="{{ url_for('show_list', list_type='wishlist') }}"
         {% if list_type == 'wishlist' %}class="active"{% endif %}>Wishlist</a>
    </nav>
    <div class="top-actions">
      <a class="btn primary" href="{{ url_for('add_game', list_type=list_type or 'collection') }}">+ Add game</a>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="btn ghost">Log out</button>
      </form>
    </div>
  </header>
  {% endif %}
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
